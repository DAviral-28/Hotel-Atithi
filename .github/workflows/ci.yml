name: CI

# Runs on GitHub's free tier (2,000 build-minutes/month on private repos, unlimited on public
# repos) — no AWS resources are touched by this workflow, so it never costs anything to run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend test suite
        run: ./mvnw --batch-mode test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend type-check + build (Vite/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  infrastructure:
    name: CDK synth (no deploy — catches infra typos for free)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: cdk synth (placeholder Lambda — no real AWS credentials, no deploy)
        # No AWS account is configured in CI, and this job never runs `cdk deploy`, so it can't
        # create or touch any real AWS resource. allowPlaceholder lets synth succeed without a
        # real backend JAR, since building/testing the JAR is the separate `backend` job above.
        # A throwaway key pair is generated inline just so the stack's key-format checks pass.
        run: |
          npx cdk synth --context allowPlaceholder=true
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
          HOTEL_ENCRYPTION_KEY_256: ${{ secrets.CI_DUMMY_KEY_256 || 'MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=' }}
          HOTEL_SIGNING_KEY_256: ${{ secrets.CI_DUMMY_SIGNING_KEY_256 || 'MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODk=' }}
